<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recipe Comparison</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fafafa;
    }
    .topbar {
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    select, button {
      padding: 6px 10px;
      font-size: 14px;
    }
    #viz {
      width: 100vw;
      height: calc(100vh - 60px);
      display: block;
      background: #fafafa;
    }
    .tooltip {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      opacity: 0;
    }
    .node-label {
      font-size: 12px;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      font-weight: 600;
    }
    .edge-label {
      font-size: 10px;
      text-anchor: middle;
      fill: #333;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <label>Recipe 1:</label>
    <select id="recipe1"></select>
    <label>Recipe 2:</label>
    <select id="recipe2"></select>
    <button id="compareBtn">Compare</button>
  </div>

  <div class="tooltip" id="tooltip"></div>
  <svg id="viz"></svg>

  <script src="./app.js"></script>
</body>
</html>
